<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Petición registrada! — FansPass</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --accent: #e8ff00; --text: #f0f0f0; --muted: #888; --border: #2a2a2a; --radius: 12px; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.4rem; font-weight: 800; text-decoration: none; color: var(--text); }
    .logo span { color: var(--accent); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 72px; height: 72px; background: rgba(232,255,0,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 24px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(232,255,0,0.1); border: 1px solid rgba(232,255,0,0.3); color: var(--accent); font-size: 0.75rem; font-weight: 700; padding: 4px 14px; border-radius: 100px; margin-bottom: 20px; }
    h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 12px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 28px; }
    .detail { background: var(--surface2); border-radius: var(--radius); padding: 20px; font-size: 0.85rem; text-align: left; margin-bottom: 28px; }
    .detail-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .key { color: var(--muted); }
    .detail-row .val { font-weight: 600; }
    .btn { display: block; width: 100%; padding: 16px; border-radius: 100px; font-weight: 800; font-size: 1rem; cursor: pointer; border: none; text-decoration: none; text-align: center; transition: opacity 0.2s; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-accent:hover { opacity: 0.9; }
    .loading { color: var(--muted); font-size: 0.9rem; }
    @media (max-width: 640px) { nav { padding: 16px 20px; } .card { padding: 32px 24px; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Fans<span>Pass</span></a>
  </nav>
  <main>
    <div class="card" id="loading-card">
      <p class="loading">Verificando tu pago...</p>
    </div>
    <div class="card" id="success-card" style="display:none">
      <div class="icon">🎉</div>
      <div class="badge">⭐ Plan Premium activado</div>
      <h1>¡Petición registrada!</h1>
      <p class="subtitle">Eres de los primeros en acceder a la preventa si el show se concreta. Te avisaremos por email.</p>
      <div class="detail" id="detail-block"></div>
      <a href="index.html" class="btn btn-accent">Pedir otro show →</a>
    </div>
    <div class="card" id="error-card" style="display:none">
      <div class="icon" style="background:rgba(255,77,77,0.12)">⚠️</div>
      <h1>Algo salió mal</h1>
      <p class="subtitle" id="error-msg">Hubo un problema procesando tu pago.</p>
      <a href="form.html" class="btn btn-accent" style="margin-top:16px">Intentar de nuevo →</a>
    </div>
  </main>

  <script>
    const STRIPE_PUBLISHABLE_KEY = 'pk_test_REEMPLAZAR_CON_TU_CLAVE';
    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);

    async function checkPayment() {
      const params = new URLSearchParams(window.location.search);
      const clientSecret = params.get('payment_intent_client_secret');

      if (!clientSecret) {
        // Llegó directamente sin pago (ej: plan free o demo)
        showDemo();
        return;
      }

      const { paymentIntent, error } = await stripe.retrievePaymentIntent(clientSecret);

      if (error || paymentIntent.status !== 'succeeded') {
        document.getElementById('loading-card').style.display = 'none';
        document.getElementById('error-card').style.display = 'block';
        if (error) document.getElementById('error-msg').textContent = error.message;
        return;
      }

      const { nombre, artista, ciudad, email } = paymentIntent.metadata;
      showSuccess({ nombre, artista, ciudad, email });
    }

    function showSuccess({ nombre, artista, ciudad, email }) {
      document.getElementById('detail-block').innerHTML = `
        <div class="detail-row"><span class="key">Artista</span><span class="val">${artista}</span></div>
        <div class="detail-row"><span class="key">Ciudad</span><span class="val">${ciudad}</span></div>
        <div class="detail-row"><span class="key">Confirmación a</span><span class="val">${email}</span></div>
        <div class="detail-row"><span class="key">Monto pagado</span><span class="val">$2.990 CLP</span></div>
      `;
      document.getElementById('loading-card').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
    }

    function showDemo() {
      document.getElementById('detail-block').innerHTML = `
        <div class="detail-row"><span class="key">Estado</span><span class="val" style="color:var(--accent)">Demo activo</span></div>
        <div class="detail-row"><span class="key">Pago real</span><span class="val" style="color:var(--muted)">Configura claves Stripe</span></div>
      `;
      document.getElementById('loading-card').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
    }

    checkPayment();
  </script>
</body>
</html>
